<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" role="img" aria-labelledby="plain-title plain-description">
<title id="plain-title">一轮工作怎样闭合</title><desc id="plain-description">判断、执行与反馈相连；交付、验收和实际效果分别核对。</desc>
<style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.plain-paper{fill:var(--plain-paper,#fff)}.plain-node rect{fill:var(--plain-paper,#fff);stroke:var(--plain-border,#cbd3da);stroke-width:1}.plain-node-label{font-size:17px;fill:var(--plain-ink,#29333b);font-weight:550}.plain-node-line{font-size:14px;fill:var(--plain-muted,#65717b)}.plain-kicker,.plain-group-label{font-size:11px;fill:var(--plain-muted,#65717b)}.plain-group{fill:none;stroke:var(--plain-border,#cbd3da);stroke-dasharray:5 5}.plain-edge{fill:none;stroke:var(--plain-muted,#7c8994);stroke-width:1.15}.plain-feedback{stroke:var(--plain-accent,#63849c)}.plain-reference{stroke-dasharray:4 4}.plain-edge-label{font-size:12px;fill:var(--plain-muted,#65717b);paint-order:stroke;stroke:var(--plain-paper,#fff);stroke-width:4}.plain-label-feedback{fill:var(--plain-accent,#63849c)}.plain-selected rect,.plain-node[role=button]:hover rect,.plain-node:focus-visible rect{stroke:var(--plain-accent,#63849c);stroke-width:2}.plain-node[role=button]{cursor:pointer}.plain-node:focus-visible{outline:none}</style>
<defs><marker id="plain-main-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#7c8994"/></marker><marker id="plain-feedback-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#63849c"/></marker><marker id="plain-reference-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#7c8994"/></marker></defs>
<rect class="plain-paper" width="100%" height="100%"/>
<text class="plain-node-label" x="24" y="25">一轮工作怎样闭合</text>
<path class="plain-edge plain-main" d="M325,142 L390,142" marker-end="url(#plain-main-arrow)"/>
<text class="plain-edge-label plain-label-main" x="357" y="128" text-anchor="middle">接受</text>
<path class="plain-edge plain-main" d="M675,142 L740,142" marker-end="url(#plain-main-arrow)"/>
<text class="plain-edge-label plain-label-main" x="707" y="128" text-anchor="middle">派发</text>
<path class="plain-edge plain-main" d="M880,200 L880,290" marker-end="url(#plain-main-arrow)"/>
<text class="plain-edge-label plain-label-main" x="900" y="251" text-anchor="middle">交付后分别核对</text>
<path class="plain-edge plain-feedback" d="M740,347 L675,347" marker-end="url(#plain-feedback-arrow)"/>
<text class="plain-edge-label plain-label-feedback" x="707" y="332" text-anchor="middle">使用证据</text>
<path class="plain-edge plain-feedback" d="M390,347 L325,347" marker-end="url(#plain-feedback-arrow)"/>
<text class="plain-edge-label plain-label-feedback" x="357" y="332" text-anchor="middle">审阅修订</text>
<path class="plain-edge plain-feedback" d="M182,290 L182,200" marker-end="url(#plain-feedback-arrow)"/>
<text class="plain-edge-label plain-label-feedback" x="204" y="250" text-anchor="middle">下一轮</text>
<g class="plain-node"><title>判断下一步：对照目标、来源与反例；人类负责人保留关键取舍</title><rect x="40" y="85" width="285" height="115" rx="4"/>
<text class="plain-node-label" x="52" y="110">判断下一步</text>
<text class="plain-node-line" x="52" y="131">对照目标、来源与反例</text>
<text class="plain-node-line" x="52" y="147">人类负责人保留关键取舍</text>
</g>
<g class="plain-node"><title>接受 Task / 固定依据：写明交付与验收判据；授权、接受、依据有效才派发</title><rect x="390" y="85" width="285" height="115" rx="4"/>
<text class="plain-node-label" x="402" y="110">接受 Task / 固定依据</text>
<text class="plain-node-line" x="402" y="131">写明交付与验收判据</text>
<text class="plain-node-line" x="402" y="147">授权、接受、依据有效才派发</text>
</g>
<g class="plain-node"><title>Run 执行与交付：保留输入、状态与回执；Run 结束 ≠ Task 验收</title><rect x="740" y="85" width="280" height="115" rx="4"/>
<text class="plain-node-label" x="752" y="110">Run 执行与交付</text>
<text class="plain-node-line" x="752" y="131">保留输入、状态与回执</text>
<text class="plain-node-line" x="752" y="147">Run 结束 ≠ Task 验收</text>
</g>
<g class="plain-node"><title>审阅后修订 Wiki：保留原判断、反例与版本；供下一次判断读取</title><rect x="40" y="290" width="285" height="115" rx="4"/>
<text class="plain-node-label" x="52" y="315">审阅后修订 Wiki</text>
<text class="plain-node-line" x="52" y="336">保留原判断、反例与版本</text>
<text class="plain-node-line" x="52" y="352">供下一次判断读取</text>
</g>
<g class="plain-node"><title>责任者审阅：比较交付、采用、效果与成本；反馈不自动采纳</title><rect x="390" y="290" width="285" height="115" rx="4"/>
<text class="plain-node-label" x="402" y="315">责任者审阅</text>
<text class="plain-node-line" x="402" y="336">比较交付、采用、效果与成本</text>
<text class="plain-node-line" x="402" y="352">反馈不自动采纳</text>
</g>
<g class="plain-node"><title>验收 / 真实使用：按约定判据核对 Task；效果未知不代替任务状态</title><rect x="740" y="290" width="280" height="115" rx="4"/>
<text class="plain-node-label" x="752" y="315">验收 / 真实使用</text>
<text class="plain-node-line" x="752" y="336">按约定判据核对 Task</text>
<text class="plain-node-line" x="752" y="352">效果未知不代替任务状态</text>
</g>
</svg>
