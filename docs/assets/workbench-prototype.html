  <style>

    .list{border:1px solid #e2e9ed;border-radius:10px;overflow:hidden;background:#fff}.list-header{display:grid;grid-template-columns:minmax(0,1fr) 94px 86px 82px;gap:10px;background:#f8fafb;border-bottom:1px solid #e5eaee;padding:10px 13px;color:#82929e;font-size:10px;font-weight:720;letter-spacing:.06em}.row{width:100%;border:0;border-bottom:1px solid #edf0f3;border-radius:0;padding:12px 13px;display:grid;grid-template-columns:minmax(0,1fr) 94px 86px 82px;gap:10px;align-items:center}.row:last-child{border-bottom:0}.row strong{display:block;font-size:12px;color:#304455;line-height:1.5}.row small{display:block;color:#7b8c99;font-size:10px;margin-top:2px}.row .cell{font-size:11px;color:#597080}.row .chip{justify-self:start}
    .detail{border-left:1px solid #e4e9ef;background:#fcfdfd;padding:24px 22px 36px;min-width:0;overflow:auto}.detail-sticky{position:sticky;top:0}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.detail-label{font-size:11px;color:#6a9299;font-weight:750;letter-spacing:.08em}.close-detail{display:none;border:0;background:#eef3f4;border-radius:7px;color:#4b6974;width:28px;height:28px;cursor:pointer}.detail h2{font-size:20px;line-height:1.35;color:#253d4b;letter-spacing:-.035em;margin:14px 0 8px;overflow-wrap:anywhere}.detail p{color:#667b88;font-size:12px;line-height:1.7;margin:0 0 14px}.detail .chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 16px}.detail-section{border-top:1px solid #e5ecef;padding-top:15px;margin-top:17px}.detail-section h3{font-size:11px;color:#7c909a;letter-spacing:.08em;margin:0 0 10px}.fact{display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:11px;line-height:1.55;padding:6px 0}.fact .key{color:#8999a3}.fact .val{color:#3b5260;overflow-wrap:anywhere}.detail-actions{display:grid;gap:7px}.detail-action{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e0e9ec;background:#fff;color:#355667;border-radius:8px;padding:10px 11px;font-size:11px;line-height:1.45;cursor:pointer}.detail-action:hover{border-color:#72b2b3;background:#f6fbfb}.detail-action span:last-child{color:#5e9a9e}.detail-action:disabled{color:#9aa7b0;background:#f5f7f8;cursor:not-allowed}.mini-flow{background:#f4f8f9;border-radius:9px;padding:12px;font-size:11px;line-height:1.75;color:#536c78}.mini-flow .arrow{color:#8eabb0;padding:0 4px}.source-box{background:#f7f9fa;border:1px solid #e5ecef;border-radius:8px;padding:10px;color:#4d6470;font-size:11px;line-height:1.65;overflow-wrap:anywhere}.source-box code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#365765}
    .topic-tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 5px}.topic-tabs button{flex:0 0 auto;border:1px solid #dce6e9;background:#fff;color:#597481;border-radius:8px;padding:8px 12px;font-size:11px;cursor:pointer}.topic-tabs button.active{border-color:#73aaad;background:#e8f5f3;color:#155e68;font-weight:750}.topic-tabs button:hover{border-color:#73aaad}

    .knowledge-type{display:inline-flex;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:760}.knowledge-type.observation{background:#e6f3f8;color:#276a80}.knowledge-type.hypothesis{background:#f3edfa;color:#725097}.knowledge-type.decision{background:#e8f4eb;color:#2d7750}.knowledge-type.dispute{background:#fff0df;color:#a26419}
    .knowledge-article{margin-top:17px;border:1px solid #dce7e9;border-radius:13px;background:#fff;padding:20px}.knowledge-article .kicker{font-size:11px;color:#688890;font-weight:700}.knowledge-article h2{font-size:21px;letter-spacing:-.03em;color:#274351;margin:8px 0}.knowledge-article .lead{color:#667d89;font-size:12px;line-height:1.7;margin:0 0 16px}.article-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.article-block{background:#f8fafb;border:1px solid #e8eef0;border-radius:9px;padding:12px}.article-block h3{margin:0 0 7px;color:#617d87;font-size:11px}.article-block p{margin:0;color:#415a67;font-size:12px;line-height:1.65}.article-block.wide{grid-column:1/-1}.inline-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.inline-links button{border:1px solid #cbdfe1;background:#fff;color:#286a75;border-radius:7px;padding:7px 9px;font-size:11px;cursor:pointer}.inline-links button:hover{background:#e9f4f3}
    .knowledge-graph{margin-top:14px;border:1px solid #e2eaec;background:#f8fbfb;border-radius:10px;padding:12px}.knowledge-graph h3{margin:0 0 6px;font-size:12px;color:#53727b}.knowledge-graph p{margin:0 0 7px;font-size:10px;color:#82959b}.knowledge-graph svg{display:block;width:100%;height:auto;min-height:160px}.knowledge-graph g[data-select]{cursor:pointer}.knowledge-graph g[data-select]:focus-visible{outline:2px solid #287f89}.knowledge-graph text{font-family:inherit;pointer-events:none}.knowledge-graph line{stroke:#a9cacc;stroke-width:2}.knowledge-graph .current circle{fill:#d6efeb;stroke:#4e9d9e}.knowledge-graph .related circle{fill:#fff;stroke:#92b4b8}.knowledge-graph circle{stroke-width:2}
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#25434c;color:#fff;border-radius:9px;padding:10px 14px;font-size:12px;box-shadow:0 8px 28px #24444c33;z-index:20;max-width:calc(100vw - 24px)}.toast[hidden]{display:none}
    @media(max-width:1120px){.app{grid-template-columns:194px minmax(390px,1fr) 300px}.main{padding-left:22px;padding-right:22px}.detail{padding-left:16px;padding-right:16px}}
    @media(max-width:850px){.app{display:block;height:auto}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;z-index:30;box-shadow:8px 0 30px #122c3f23;transform:translateX(-110%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.menu-button{display:block;background:#eff5f5;color:#235b64;border:0;border-radius:7px;padding:8px 10px;font-size:13px;cursor:pointer}.main{padding:20px 17px 40px;overflow:visible}.detail{border-left:0;border-top:1px solid #dce5e9;padding:22px 17px 35px}.detail-sticky{position:static}.close-detail{display:block}.detail.collapsed{display:none}.list-header,.row{grid-template-columns:minmax(0,1fr) 88px 78px}.list-header span:last-child,.row>*:last-child{display:none}}
    @media(max-width:540px){.topbar h1{font-size:23px}.topbar{align-items:center}.demo-banner{align-items:flex-start;display:block}.demo-banner strong{display:block;margin-bottom:3px}.hero{padding:16px}.hero-top{display:block}.hero .primary{margin-top:14px;width:100%}.cards,.knowledge-grid,.article-grid{grid-template-columns:1fr}.article-block.wide{grid-column:auto}.card,.knowledge-card{min-height:0}.knowledge-article{padding:14px}.section{margin-top:24px}.row{grid-template-columns:minmax(0,1fr) 78px;gap:6px}.list-header{grid-template-columns:minmax(0,1fr) 78px}.list-header span:nth-child(3),.row>*:nth-child(3){display:none}.row{padding:12px 10px}.row strong{font-size:11px}.detail h2{font-size:18px}}
  </style>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="项目导航">
      <div class="brand"><span class="mark">e</span>evoLoop</div>
      <div><p class="smallcap">当前项目</p><div class="project"><strong>evoLoop · 产品演进</strong><span>设计演示项目 · 未连接服务</span></div></div>
      <nav class="nav" id="nav" aria-label="工作台视图"></nav>
      <div class="side-note">本页是可点击的设计样稿。任务、文档、知识和同步信息均为示例；点击只改变本页展示。</div>
    </aside>
    <main class="main">
      <div class="topbar"><div><p class="eyebrow">工作台 / 设计演示</p><h1 id="viewTitle">当前关注</h1><p class="subtitle" id="viewSubtitle"></p></div><button class="menu-button" id="menuButton" aria-controls="sidebar" aria-expanded="false">☰ 导航</button></div>
      <div class="demo-banner"><strong>示例数据 · 未连接服务</strong><span>所有对象、版本与状态只用于评审界面。模拟操作不会写入 evoLoop、飞书、Git 或外置 Wiki。</span></div>
      <section class="section" aria-label="体验路径"><div class="section-head"><div><h2>复核路径</h2><p class="hint">依次点击，查看一次需求修订怎样影响任务依据。</p></div><button class="text-button" id="resetButton">重置演示</button></div><div class="journey" id="journey"></div></section>
      <div id="content"></div>
    </main>
    <aside class="detail" id="detail" aria-label="所选对象详情"><div class="detail-sticky" id="detailContent"></div></aside>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
  (()=>{
    'use strict';
    const views={focus:['当前关注','待讨论的选择和需要人工复核的变化。'],tasks:['任务','任务状态、依据复核和协作同步分别查看。'],documents:['文档目录','原生需求与 Git 正式规范保留各自的权威位置。'],knowledge:['知识空间','按专题浏览知识点、反例和关联；正文属于外置 Wiki。'],cognition:['认知讨论','以证据、反例和当前基线准备下一步方向。'],roles:['分工试行','职责变化先试行，有回看和退出条件。']};
    const steps=[['discussion','认知讨论'],['doc','需求 r2'],['task','任务待复核'],['git','Git 规范'],['wiki','Wiki 纠正'],['review','采用新基线']];
    const objects={
      discussion:{kind:'讨论准备',title:'下一步方向：需求基线变化后怎么办？',desc:'专门认知 session 准备比较：继续当前任务、按新验收复核，或先补证。没有自动采纳结论。',chips:[['待讨论','proposed'],['示例','muted']],facts:[['讨论目标','选择下一步，不代替任务接受'],['当前材料','DOC-021 r2 · 用户纠正 K-07 v3'],['待确认','TASK-104 的 r1 依据是否继续有效']],source:'来源为示例用户反馈与需求修订，均未在真实服务中创建。',actions:[['查看需求 DOC-021 r2','doc']]},
      doc:{kind:'原生需求 · DOC-021',title:'接续时必须核对实际成果',desc:'r2 将“通知已发出”改为“接收者读取成果并形成回看结论”的验收。r1 保留为 TASK-104 被接受时的旧基线。',chips:[['r2 · 已采纳（示例）','good'],['r1 · 历史基线','muted']],facts:[['权威位置','evoLoop 原生文档（设计目标）'],['当前修订','DOC-021 r2'],['上次修订','DOC-021 r1：通知即可'],['变更原因','实际使用显示：通知成功不等于接续采用']],source:'示例修订：r1 与 r2 均为演示数据。正式 Git 规范只以固定 commit 引用，不在此编辑。',actions:[['查看受影响任务 TASK-104','task'],['查看相关 Wiki 纠正','wiki']]},
      task:{kind:'任务 · TASK-104',title:'验证接续提醒是否被实际采用',desc:'任务仍显示执行状态，但其接受时依据的 DOC-021 r1 已被 r2 取代，需要单独判断任务验收基线。',chips:[['任务：进行中','work'],['依据：待复核','review'],['运行：未连接','sync'],['飞书：待同步','sync'],['亲用：待核对','muted']],facts:[['接受基线','DOC-021 r1（历史保留）'],['当前需求','DOC-021 r2'],['责任','接续体验领域 session（示例）'],['验收','目标消费者实际读取成果并反馈']],source:'示例任务。待复核不等于任务失败、停止或自动采用新需求；飞书同步状态也不代表任务完成。',actions:[['查看 Git 规范固定 commit','git'],['查看 Wiki 纠正 K-07 v3','wiki'],['进入复核选择','review']]},
      git:{kind:'Git 正式规范 · 固定引用',title:'接续记录规范',desc:'规范正文由 Git 仓库维护。此处只展示固定版本引用和与任务的关系，不提供在工作台改写规范的入口。',chips:[['引用模式','muted'],['固定 commit · 示例','proposed']],facts:[['仓库','evoLoop（示例）'],['路径','docs/development/standards.md'],['固定修订','8e4c2b7…（虚构示意）'],['关联','TASK-104 的规范依据']],source:'此 commit 仅是界面示意，未验证存在；原型不会打开外部链接或修改 Git。',actions:[['查看 Wiki 中的纠正','wiki'],['返回受影响任务','task']]},
      wiki:{kind:'外置 Wiki · K-07',title:'通知成功 ≠ 接续采用',desc:'v3 记录用户纠正：仅看到发送成功不能证明接收者已阅读、理解并使用结果；需要在真实任务产物中核对。',chips:[['v3 · 当前示例','good'],['外置知识空间','proposed']],facts:[['知识位置','外置 Wiki（非本开发仓库）'],['修订','K-07 v3；v2 保留为历史'],['纠正来源','示例用户反馈 + 接续观察'],['影响对象','DOC-021 r2 · TASK-104']],source:'示例知识摘要与修订号，不是生产 Wiki 正文。真实引用需要来源、适用条件、反例和依赖状态。',actions:[['复核 TASK-104 的基线','review'],['返回 DOC-021 r2','doc']]},

      const k=knowledge[state.selected];
      if(k){
        $('detailContent').innerHTML=`<div class="detail-head"><span class="detail-label">外置 Wiki · 来源侧栏</span><button class="close-detail" id="closeDetail" aria-label="收起详情">×</button></div><h2>${escape(k.id)} · ${escape(k.title)}</h2><p>示例知识阅读视图。卡片和关系图帮助发现内容，不表示该主张已验证。</p><div class="chips"><span class="knowledge-type ${k.className}">${escape(k.type)}</span>${chip(k.revision+' · 示例','good')}${chip(k.topic,'muted')}</div><div class="detail-section"><h3>修订与状态</h3><div class="fact"><span class="key">更新时间</span><span class="val">${escape(k.updated)}（示例）</span></div><div class="fact"><span class="key">来源</span><span class="val">${k.evidence} 条依据示例；逐条核对原件</span></div><div class="fact"><span class="key">正文位置</span><span class="val">外置 Wiki，不在开发仓库</span></div></div><div class="detail-section"><h3>来源 · 返回权威对象</h3><div class="detail-actions">${k.sources.map(([name,target])=>button(name,target)).join('')}</div></div><div class="detail-section"><h3>相关知识 · 双向阅读</h3><div class="detail-actions">${k.related.map(rid=>button(knowledge[rid].id+' · '+knowledge[rid].title,rid)).join('')}</div></div><div class="detail-section"><h3>阅读边界</h3><div class="source-box">内容、版本、依据数量均为合成示例，未连接 Wiki。纠错 Review 即使标记“已处理”，也不能替代正文修订与后续独立使用核对。</div></div>`;
        $('detail').classList.remove('collapsed');return;
      }
      const o=objects[state.selected];const adopted=state.selected==='review'&&state.adopted;
      let visibleChips=o.chips;
      if(state.selected==='task'&&state.adopted)visibleChips=o.chips.map(([label,kind])=>label==='依据：待复核'?['依据：已模拟采用 r2','good']:[label,kind]);
      if(adopted)visibleChips=[['已模拟采用 r2','good'],['无外部写入','muted']];
      const title=adopted?'已模拟采用 DOC-021 r2 作为后续基线':o.title;
      const desc=state.selected==='task'&&state.adopted?'任务仍在进行中；当前执行基线已在本页模拟采用 DOC-021 r2。最初接受时的 r1 保留为历史。':adopted?'本页模拟完成复核选择；旧接受基线 r1 保留。尚无真实执行、同步或亲用结果。':o.desc;
      const facts=state.selected==='task'&&state.adopted?[...o.facts,['当前执行基线','DOC-021 r2（仅本页模拟）']]:adopted?[['最初依据','DOC-021 r1（历史保留）'],['当前执行基线','DOC-021 r2（仅本页模拟）'],['知识参考','K-07 v3'],['本页结论','采用新基线；真实效果待验证']]:o.facts;
      $('detailContent').innerHTML=`<div class="detail-head"><span class="detail-label">依据与版本 · ${escape(o.kind)}</span><button class="close-detail" id="closeDetail" aria-label="收起详情">×</button></div><h2>${escape(title)}</h2><p>${escape(desc)}</p><div class="chips">${visibleChips.map(c=>chip(...c)).join('')}</div><div class="detail-section"><h3>对象信息</h3>${facts.map(([key,val])=>`<div class="fact"><span class="key">${escape(key)}</span><span class="val">${escape(val)}</span></div>`).join('')}${state.adopted&&(state.selected==='task'||state.selected==='review')?'<div class="fact"><span class="key">本页结果</span><span class="val">后续验收模拟采用 r2；最初接受基线 r1 历史保留</span></div>':''}</div><div class="detail-section"><h3>依据链</h3><div class="mini-flow">DOC-021 r1 <span class="arrow">→</span> TASK-104 <span class="arrow">↔</span> DOC-021 r2<br>Git 固定 commit <span class="arrow">·</span> Wiki K-07 v3</div></div><div class="detail-section"><h3>来源与边界</h3><div class="source-box">${escape(o.source)}</div></div><div class="detail-section"><h3>继续查看</h3><div class="detail-actions">${o.actions.map(([label,id])=>button(label,id)).join('')}${state.selected==='review'?`<button class="primary" id="adoptButton" ${state.adopted?'disabled':''} title="${state.adopted?'本页已模拟采用':'只模拟本页状态，不写入服务'}">${state.adopted?'已模拟采用 r2':'模拟采用新基线 r2'}</button>`:''}</div></div>`;
      $('detail').classList.remove('collapsed');
    }
    function render(){renderNav();renderJourney();renderContent();renderDetail()}
    let toastTimer;function toast(message){const el=$('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
    function select(id){if(!objects[id]&&!knowledge[id])return;state.selected=id;if(knowledge[id]){state.view='knowledge';if(state.topic!=='全部专题'&&knowledge[id].topic!==state.topic)state.topic=knowledge[id].topic}else state.view=({discussion:'cognition',doc:'documents',task:'tasks',git:'documents',review:'tasks',role:'roles',task2:'tasks',doc2:'documents'})[id]||state.view;render();if(knowledge[id])document.querySelector('.knowledge-article').scrollIntoView({behavior:'smooth',block:'start'});else if(innerWidth<=850)$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
    document.addEventListener('click',e=>{const s=e.target.closest('[data-select]');if(s){select(s.dataset.select);return}const t=e.target.closest('[data-topic]');if(t){state.topic=t.dataset.topic;state.selected=Object.keys(knowledge).find(id=>state.topic==='全部专题'||knowledge[id].topic===state.topic);render();return}const v=e.target.closest('[data-view]');if(v){state.view=v.dataset.view;state.selected=({focus:'discussion',tasks:'task',documents:'doc',knowledge:'wiki',cognition:'discussion',roles:'role'})[state.view];if(state.view==='knowledge')state.topic='全部专题';render();$('sidebar').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'smooth'});return}if(e.target.id==='adoptButton'){state.adopted=true;render();toast('仅本页模拟采用 r2；未写入任何服务。');return}if(e.target.id==='resetButton'){state.view='focus';state.selected='discussion';state.adopted=false;state.topic='全部专题';render();toast('演示状态已重置。');return}if(e.target.id==='menuButton'){const open=$('sidebar').classList.toggle('open');e.target.setAttribute('aria-expanded',String(open));return}if(e.target.id==='closeDetail'){$('detail').classList.add('collapsed')}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('sidebar').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false')}if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-select]')){e.preventDefault();select(e.target.dataset.select)}});
    render();
  })();
  </script>
</body>
</html>
