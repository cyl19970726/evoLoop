    const documentBodies={"doc":{"format":"Markdown","revisions":{"r1":{"source":"# DOC-021 r1 · 接续提醒需求（历史）\n\n> **设计演示 / 合成历史修订。** TASK-104 被接受时引用此版；这不是当前需求，也不是正式产品定义。\n\n## 目标\n\n当成果可供下一个 session 接续时，向目标责任者发送提醒，并记录发送回执。\n\n## 当时的验收\n\n| 行为 | 证据 |\n| --- | --- |\n| 找到目标责任者 | 责任映射存在。 |\n| 发送交接通知 | 系统记录发送回执。 |\n\n## 后来发现的缺口\n\n发送成功无法证明接收者已经阅读、理解并使用成果。r2 因此增加独立消费与实际效果的核对要求。旧版继续作为 TASK-104 的历史接受基线，不会被新修订自动改写。\n","rendered":"<h1>DOC-021 r1 · 接续提醒需求（历史）</h1>\n<blockquote>\n<p><strong>设计演示 / 合成历史修订。</strong> TASK-104 被接受时引用此版；这不是当前需求，也不是正式产品定义。</p>\n</blockquote>\n<h2>目标</h2>\n<p>当成果可供下一个 session 接续时，向目标责任者发送提醒，并记录发送回执。</p>\n<h2>当时的验收</h2>\n<table>\n<thead>\n<tr>\n<th>行为</th>\n<th>证据</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>找到目标责任者</td>\n<td>责任映射存在。</td>\n</tr>\n<tr>\n<td>发送交接通知</td>\n<td>系统记录发送回执。</td>\n</tr>\n</tbody>\n</table>\n<h2>后来发现的缺口</h2>\n<p>发送成功无法证明接收者已经阅读、理解并使用成果。r2 因此增加独立消费与实际效果的核对要求。旧版继续作为 TASK-104 的历史接受基线，不会被新修订自动改写。</p>\n"},"r2":{"source":"# DOC-021 · 接续成果读取与采用需求\n\n> **设计演示 / 合成过程文档。** 这份正文仅用于评审工作台阅读体验；未进入真实 Document Table，也没有用户亲用结论。当前示例修订为 r2，关联 TASK-104。\n\n## 1. 目标与任务关联\n\n目标是在新 session 接续已有成果时，能找到当前需求、来源与适用版本，并在后续任务产物中说明是否使用。DOC-021 直接关联 TASK-104；任务接受时固定的是 DOC-021 r1。r2 是后来采纳的工作需求修订，不能静默覆盖旧任务的执行基线。\n\n## 2. 观察与问题\n\n合成观察：一次交接通知显示发送成功，但接收者没有在下一项工作中引用成果修订。发送回执只证明消息送达，不能证明阅读、理解或采用。来源还需要独立核对，不能把此例当作生产事故统计。\n\n## 3. 适用范围\n\n- 适用：跨 session 交接、需求变化通知、接续成果的消费记录。\n- 不适用：目标仅为投递消息的任务；此类任务不能被强行要求证明后续亲用。\n- 前提：接续方有权读取固定修订及其来源；不可达时显示缺项并请求复核。\n\n## 4. 需求与验收\n\n| 编号 | 应有行为 | 可核对的验收证据 |\n| --- | --- | --- |\n| R-01 | 接续入口展示固定需求修订、成果位置与适用条件。 | 接收者能打开原件并指出所读修订。 |\n| R-02 | 分开显示“已通知”“已读取”“产物采用”“实际效果”。 | 每一状态有自己的时间、对象和来源；不能由发送回执自动推断采用。 |\n| R-03 | 上游需求修订后标出引用旧版的任务。 | TASK-104 可比较 r1/r2，并由有权者选择继续、换基线、补证或拆任务。 |\n| R-04 | 来源不可核对时保留已知引用与待复核状态。 | 页面不从缓存摘要补造原件，也不把未知显示为成功。 |\n\n## 5. 版本与决定\n\nr1 把“通知已发出”作为交接验收。r2 根据用户纠正，把“接收者读取并在后续工作中使用”作为需要另行核对的效果。r2 在本演示中标为已采纳的工作需求；TASK-104 是否采用 r2，仍由任务依据复核单独决定。原 r1 保留为历史。\n\n## 6. 交付与未决\n\n交付候选包括修订差异、任务影响提示和消费记录入口。尚未验证真实消费者能否在新 session 中独立完成工作；也尚未证明任何提醒机制改善了用户结果。下一步应让接续方执行一项真实任务，记录首轮失败、人工帮助和实际产物，再决定继续或修订。\n\n## 7. 与仓库正式文档的关系\n\n本文件是 TASK-104 的过程需求。若其中某项结论成为长期产品规则，可按固定修订、采纳决定和目标段落提出仓库变更，经 PR 审阅、合并与构建核对。DOC-021 本身仍保留历史，不会整份搬入 `docs/`，也不会因任务完成自动发布。\n","rendered":"<h1>DOC-021 · 接续成果读取与采用需求</h1>\n<blockquote>\n<p><strong>设计演示 / 合成过程文档。</strong> 这份正文仅用于评审工作台阅读体验；未进入真实 Document Table，也没有用户亲用结论。当前示例修订为 r2，关联 TASK-104。</p>\n</blockquote>\n<h2>1. 目标与任务关联</h2>\n<p>目标是在新 session 接续已有成果时，能找到当前需求、来源与适用版本，并在后续任务产物中说明是否使用。DOC-021 直接关联 TASK-104；任务接受时固定的是 DOC-021 r1。r2 是后来采纳的工作需求修订，不能静默覆盖旧任务的执行基线。</p>\n<h2>2. 观察与问题</h2>\n<p>合成观察：一次交接通知显示发送成功，但接收者没有在下一项工作中引用成果修订。发送回执只证明消息送达，不能证明阅读、理解或采用。来源还需要独立核对，不能把此例当作生产事故统计。</p>\n<h2>3. 适用范围</h2>\n<ul>\n<li>适用：跨 session 交接、需求变化通知、接续成果的消费记录。</li>\n<li>不适用：目标仅为投递消息的任务；此类任务不能被强行要求证明后续亲用。</li>\n<li>前提：接续方有权读取固定修订及其来源；不可达时显示缺项并请求复核。</li>\n</ul>\n<h2>4. 需求与验收</h2>\n<table>\n<thead>\n<tr>\n<th>编号</th>\n<th>应有行为</th>\n<th>可核对的验收证据</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>R-01</td>\n<td>接续入口展示固定需求修订、成果位置与适用条件。</td>\n<td>接收者能打开原件并指出所读修订。</td>\n</tr>\n<tr>\n<td>R-02</td>\n<td>分开显示“已通知”“已读取”“产物采用”“实际效果”。</td>\n<td>每一状态有自己的时间、对象和来源；不能由发送回执自动推断采用。</td>\n</tr>\n<tr>\n<td>R-03</td>\n<td>上游需求修订后标出引用旧版的任务。</td>\n<td>TASK-104 可比较 r1/r2，并由有权者选择继续、换基线、补证或拆任务。</td>\n</tr>\n<tr>\n<td>R-04</td>\n<td>来源不可核对时保留已知引用与待复核状态。</td>\n<td>页面不从缓存摘要补造原件，也不把未知显示为成功。</td>\n</tr>\n</tbody>\n</table>\n<h2>5. 版本与决定</h2>\n<p>r1 把“通知已发出”作为交接验收。r2 根据用户纠正，把“接收者读取并在后续工作中使用”作为需要另行核对的效果。r2 在本演示中标为已采纳的工作需求；TASK-104 是否采用 r2，仍由任务依据复核单独决定。原 r1 保留为历史。</p>\n<h2>6. 交付与未决</h2>\n<p>交付候选包括修订差异、任务影响提示和消费记录入口。尚未验证真实消费者能否在新 session 中独立完成工作；也尚未证明任何提醒机制改善了用户结果。下一步应让接续方执行一项真实任务，记录首轮失败、人工帮助和实际产物，再决定继续或修订。</p>\n<h2>7. 与仓库正式文档的关系</h2>\n<p>本文件是 TASK-104 的过程需求。若其中某项结论成为长期产品规则，可按固定修订、采纳决定和目标段落提出仓库变更，经 PR 审阅、合并与构建核对。DOC-021 本身仍保留历史，不会整份搬入 <code>docs/</code>，也不会因任务完成自动发布。</p>\n"}}},"workdoc":{"format":"HTML","revision":"r3","source":"<!doctype html>\n<html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'\"><title>DOC-018 r3 交接来源核对报告 · 合成示例</title><style>\n:root{font-family:system-ui,\"PingFang SC\",sans-serif;color:#253d4b;background:#f1f5f7}*{box-sizing:border-box}body{margin:0;padding:24px}.sheet{max-width:840px;margin:auto;background:#fff;border:1px solid #d8e4e9;border-radius:12px;padding:clamp(18px,4vw,40px)}.flag{display:inline-block;background:#fff0cc;color:#704f13;border-radius:5px;padding:5px 9px;font-size:12px;font-weight:700}h1{font-size:27px;margin:17px 0 6px}h2{font-size:18px;border-top:1px solid #e3eaed;padding-top:22px;margin-top:25px}p,li{line-height:1.75;font-size:14px;color:#526a76}.meta{font-size:12px;color:#718995}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.metric{background:#eaf4f5;border-radius:8px;padding:12px;font-size:12px;color:#315b66}.metric strong{display:block;font-size:17px;color:#1c5360}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #d8e4e9;padding:9px;text-align:left;vertical-align:top}th{background:#eef5f7}details{background:#f5f9fa;border:1px solid #dce8eb;border-radius:8px;padding:12px;margin:12px 0}summary{cursor:pointer;font-weight:700;color:#235a66}.conclusion{border-left:4px solid #2d8a82;background:#eff8f5;padding:11px 15px;margin:16px 0}.foot{font-size:12px;color:#7a8e98}@media(max-width:600px){body{padding:10px}.grid{grid-template-columns:1fr}h1{font-size:23px}}\n</style></head><body><main class=\"sheet\"><span class=\"flag\">设计演示 · 合成 HTML 报告 · 未连接服务</span><h1>DOC-018 r3 · 交接来源核对报告</h1><p class=\"meta\">关联 TASK-092 · 示例更新时间 2026-10-19 · 过程文档，非仓库正式规范</p>\n<section><h2>一、问题与范围</h2><p>本报告演示一份技术讨论/调查过程文档如何在工作台完整阅读。目标是整理交接来源的位置、所见修订和消费者反馈。所有样本、编号与判断均为合成内容，不代表真实运行。</p><div class=\"grid\"><div class=\"metric\"><strong>3 类</strong>待核来源</div><div class=\"metric\"><strong>r3</strong>固定演示修订</div><div class=\"metric\"><strong>未知</strong>实际亲用效果</div></div></section>\n<section><h2>二、材料与核对方法</h2><p>逐项记录来源原件、所见版本与可核对性；如果来源不可达，保留引用但不补造正文。把“通知送达”和“后续产物采用”分开判断。</p><table><thead><tr><th>来源</th><th>所见位置</th><th>本轮观察</th></tr></thead><tbody><tr><td>需求工作文档</td><td>DOC-021 r2</td><td>要求在下游产物中核对采用。</td></tr><tr><td>任务记录</td><td>TASK-104</td><td>旧 r1 基线仍待单独复核。</td></tr><tr><td>知识认识</td><td>K-07 v3</td><td>通知回执不能替代效果证据。</td></tr></tbody></table></section>\n<section><h2>三、观察、反例与限制</h2><p>合成观察显示通知可送达，但尚缺目标消费者的完整产物。也可能是成果入口不清、权限不足或任务说明含糊，不能仅凭一次遗漏决定新增岗位或宣称提醒失败。</p><details><summary>展开核对记录与待补证据</summary><ul><li>记录消息与产物的固定时间及修订。</li><li>让独立接续者说明读到了什么、用在何处。</li><li>保留首轮失败和人工帮助，不只展示修正后的成功路径。</li></ul></details></section>\n<section><h2>四、结论与下一步</h2><div class=\"conclusion\"><strong>当前结论：</strong>来源链可作为待核线索；实际采用和用户效果仍未知。DOC-018 r3 不自动成为产品规则，也不自动纳入仓库正式文档。</div><p>下一步由 TASK-092 的责任者核对原件和消费者产物，再决定是否采纳某条结论。若形成长期规则，择要提出仓库文档差异，并保留本报告历史。</p></section><p class=\"foot\">报告末尾 · sandbox 中的原生 details 可展开；没有脚本、表单提交或外部资源。</p></main></body></html>"}};
    const topics=['全部专题','接续与验收','需求与依据','分工演进','来源治理'];
    const topicNotes={'全部专题':'围绕真实工作沉淀的认识与争议；按专题寻找，不按热度排序。','接续与验收':'怎样确认成果被后续任务真正使用。','需求与依据':'需求版本、任务基线和知识理由如何相互影响。','分工演进':'从实际负荷与接续效果判断职责是否需要变化。','来源治理':'来源撤回、适用边界和失效传播仍需核对。'};
    const knowledgeRevision=id=>state.correction?.id===id&&['published','read'].includes(state.correction.stage)?'v4（本页模拟）':knowledge[id].revision;
    const knowledgeCard=(id,k)=>`<button class="knowledge-card${state.selected===id?' active':''}" data-select="${id}"><span class="top"><span class="knowledge-type ${k.className}">${escape(k.type)}</span><span class="overline">${escape(k.id)} · ${escape(knowledgeRevision(id))}</span></span><strong>${escape(k.title)}</strong><p>${escape(k.summary)}</p><span class="foot"><span>${k.evidence} 条依据 · 示例</span><span>更新 ${escape(k.updated)}</span></span></button>`;
    function relationGraph(id){
      const k=knowledge[id],related=k.related.slice(0,3),spots=[[95,63],[405,63],[250,163]];
      const edges=related.map((_,i)=>`<line x1="250" y1="88" x2="${spots[i][0]}" y2="${spots[i][1]}"/>`).join('');
      const nodes=related.map((rid,i)=>{const p=spots[i],r=knowledge[rid];return `<g class="related" data-select="${rid}" role="button" tabindex="0" aria-label="打开关联知识 ${escape(r.id)} ${escape(r.title)}"><title>${escape(r.title)}</title><circle cx="${p[0]}" cy="${p[1]}" r="28"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="11" fill="#486772">${escape(r.id)}</text></g>`}).join('');
      return `<div class="knowledge-graph"><h3>相关知识图</h3><p>点击节点阅读；线表示双向相关，不代表结论已被证实。</p><svg viewBox="0 0 500 200" role="group" aria-label="${escape(k.id)} 与相关知识的关系图">${edges}${nodes}<g class="current"><circle cx="250" cy="88" r="34"/><text x="250" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6770">${escape(k.id)}</text></g></svg></div>`;
    }
    function knowledgeArticle(id){
      const k=knowledge[id],c=state.correction?.id===id?state.correction:null;
      const published=c&&['published','read'].includes(c.stage);
      const sourceWarning=state.sourceUnavailable&&id==='wiki'?'<div class="panel warn"><strong>来源不可达 · 本页模拟</strong><p>当前正文仍可查看，但这条来源无法核验；相关判断与 TASK-104 应待复核，不得从缓存摘要补造原文。</p></div>':'';
      const stale=state.historyView&&id==='wiki',displayConclusion=stale?'历史 v2（示例）：通知可以作为交接线索，但尚未把接收者在后续产物中采用成果作为验收判据。':k.conclusion;
      const publishBlock=c&&(state.sourceUnavailable&&id==='wiki'?'来源不可核对，先补证后再发布':c.basisRevision!==knowledgeRevision(id)?'候选基线已过期，重新核对当前版后提出候选':'');
      const reviewStage={candidate:'候选待审',accepted:'已接受内容修改、待发布',publish_pending:'发布请求待返回',unknown:'发布结果未知、先核对',published:'已模拟收到 v4、采用未证实',read:'已模拟读取 v4、实际效果未知',rejected:'已驳回，正文不变',duplicate:'已归并重复，正文不变',no_change:'审阅后无须改文，正文不变'};
      const review=c?`<div class="panel warn"><h3>纠正 Review · ${reviewStage[c.stage]}</h3><p><strong>原件位置：</strong>${escape(c.source)}<br><strong>建议修正：</strong>${escape(c.text)}<br><strong>不可变候选：</strong>c1 · 基于 ${escape(c.basisRevision)} · 演示指纹 ${escape(c.fingerprint)}${c.acceptedFingerprint?`<br><strong>发布授权绑定：</strong>c1 / ${escape(c.acceptedFingerprint)}`:''}${c.closeReason?`<br><strong>关闭理由：</strong>${escape(c.closeReason)}`:''}</p><div class="chips">${chip('候选：c1','work')}${chip(c.stage==='candidate'?'审阅：待判断':['rejected','duplicate','no_change'].includes(c.stage)?'审阅：有理由关闭':'审阅：接受内容修改',c.stage==='candidate'?'review':'good')}${chip(published?'正文：返回 v4（仅演示）':'正文：仍为 '+k.revision,published?'good':'review')}${chip(c.stage==='read'?'消费：模拟已读，采用待验':'消费：待独立核对','muted')}</div><div class="action-row">${c.stage==='candidate'?'<button class="inline-action" data-action="correction-decide">接受内容修改</button><button class="inline-action" data-action="correction-reject">有理由驳回</button><button class="inline-action" data-action="correction-duplicate">归并重复</button><button class="inline-action" data-action="correction-no-change">无需改文</button>':''}${c.stage==='accepted'?`<button class="inline-action" data-action="correction-publish" ${publishBlock?'disabled':''}>模拟单独请求发布 c1</button>${publishBlock?`<p>${escape(publishBlock)}</p>`:''}`:''}${c.stage==='publish_pending'?'<button class="inline-action" data-action="correction-return">模拟收到并核对 v4</button><button class="inline-action" data-action="correction-unknown">模拟结果未知</button>':''}${c.stage==='unknown'?'<button class="inline-action" data-action="correction-reconcile">回读核对发布结果</button>':''}${c.stage==='published'?'<button class="inline-action" data-action="correction-read">模拟下游读取 v4</button>':''}</div><p>接受 Review 不改 Wiki 正文。发布请求必须绑定候选 c1 及其指纹；结果未知先回读核对，不能盲目重发。下游读取仍不等于产物采用或亲用有效。</p></div>`:'';
      return `<article class="knowledge-article"><div class="kicker">外置 Wiki 阅读示意 · ${escape(k.topic)} · ${escape(k.id)} · 所看 ${escape(stale?'v2（历史）':knowledgeRevision(id))}</div><h2>${escape(k.title)}</h2><p class="lead">${escape(k.summary)}</p>${stale?`<div class="panel warn"><strong>正在看历史 v2 · 当前 ${escape(knowledgeRevision(id))}</strong><p>历史内容不能当成当前约束；回到当前修订后再用于新任务。</p></div>`:''}${sourceWarning}<div class="article-grid"><div class="article-block wide"><h3>${stale?'历史判断':'当前结论 / 判断'}</h3><p>${escape(displayConclusion)}</p>${published&&!stale?`<p><strong>本页模拟 v4 补记：</strong>${escape(c.text)}</p>`:''}</div><div class="article-block"><h3>适用条件</h3><p>${escape(k.conditions)}</p></div><div class="article-block"><h3>反例与未决</h3><p>${escape(k.counter)}</p></div><div class="article-block"><h3>来源 · ${k.evidence} 条依据示例</h3><p>${state.sourceUnavailable&&id==='wiki'?'一条来源当前不可核对。':'来源在各自权威位置维护；可由右侧打开示例关联。'}</p><div class="inline-links">${k.sources.map(([name,target])=>`<button data-select="${target}">${escape(name)}</button>`).join('')}</div></div><div class="article-block"><h3>关联知识</h3><p>从任何节点均可回到相邻知识点。</p><div class="inline-links">${k.related.map(rid=>`<button data-select="${rid}">${escape(knowledge[rid].id)} · ${escape(knowledge[rid].title)}</button>`).join('')}</div></div><div class="article-block wide"><h3>版本脉络</h3><p>${escape(k.versions)}${published?' 本页另模拟 v4；完整历史回读待后端实现，真实 Wiki 未变。':''}</p></div></div><div class="action-row"><button class="inline-action" data-action="correction-open">提交带来源的纠正</button>${id==='wiki'?`<button class="inline-action" data-action="history-toggle">${stale?'回到当前修订':'查看历史 v2'}</button><button class="inline-action" data-action="source-toggle">${state.sourceUnavailable?'恢复来源可核对示意':'模拟来源不可达'}</button>`:''}</div>${state.correctionForm?`<div class="panel"><h3>纠正候选 · ${escape(k.id)}</h3><form class="demo-form" id="correctionForm"><label>可核对的原件位置<input name="source" required placeholder="示例：用户反馈 E-09 / 段落 2"></label><label>具体反例或修正<textarea name="text" required placeholder="写出旧结论哪里不成立，以及建议怎样限定"></textarea></label><button class="primary" type="submit">提交本页候选</button></form></div>`:''}${review}${relationGraph(id)}</article>`;
    }
    function renderKnowledge(){

    }

    function renderFocus(){return `<div class="hero"><div class="hero-top"><div><div class="meta">阶段目标 · 设计示例</div><h2>让新 session 可靠接续已有成果</h2><p>交付目标：接续方能找到当前需求和成果。学习问题：通知到达后是否真的被阅读并用于下一项工作？阶段效果尚无真实亲用证据。</p></div><button class="primary" data-view="inbox">查看待判断</button></div></div><section class="section"><div class="section-head"><div><h2>两种日常讨论</h2><p class="hint">准备证据与备选；打开材料不代表已启动 Codex 会话。</p></div></div><div class="cards">${viewCard('cognition','下一步方向 · 专门认知 session','功能方向要先改需求还是补证？','比较 DOC-021 r2、K-07 v3 与 TASK-104 旧基线；决定尚待判断。',[['认知讨论','proposed']])}${viewCard('roles','当前分工 · 分工管理 session','接续核对由谁持续承担？','比较改方法、同职责加容量、临时专项与新职责试行。',[['分工讨论','proposed']])}</div></section><section class="section"><div class="section-head"><div><h2>需要处理</h2><p class="hint">这里只显示下一动作，详细状态到对应页面核对。</p></div></div><div class="split">${viewCard('inbox','提议','真实使用发现进入待判断',state.proposal?'本页已有一条临时提议，仍未被接受。':'记录 dogfood 或需求及预期效果。',[['需判断','review']])}${viewCard('operations','异常','运行结果未知与飞书冲突','先回读和对账，保留原意图，不盲目重发。',[['待对账','review']])}</div></section><section class="section"><div class="action-row"><button class="inline-action" data-view="schedules">查看日程与触发</button><button class="inline-action" data-view="evaluations">查看 Wiki 效果评价</button><button class="inline-action" data-view="knowledge">浏览知识空间</button></div></section>`}
    function renderInbox(){return `<section class="section"><div class="section-head"><div><h2>提出问题或需求</h2><p class="hint">表单预填的是合成例子；提交仅保留在当前页，不创建真实任务。</p></div></div><div class="panel"><form class="demo-form" id="proposalForm"><div class="split"><label>来源<select name="origin"><option value="真实使用 / dogfood">真实使用 / dogfood</option><option value="其他提议">其他提议</option></select></label><label>类型<select name="kind"><option value="新需求">新需求</option><option value="缺陷">缺陷</option></select></label></div><label>观察与复现条件<textarea name="observation" required>新 session 收到交接通知，但没有在下一项工作中引用成果修订。</textarea></label><label>希望产生的效果与消费者验收<textarea name="expected" required>接续方沿真实任务读取成果，并在产物中说明采用了哪版需求。</textarea></label><label>判断责任<select name="judge"><option value="需合适独立判断者">需合适独立判断者（新方向）</option><option value="现有领域责任者">现有领域责任者（常规修复）</option></select></label><div class="action-row"><button class="primary" type="submit">提交本页提议</button><button class="inline-action" type="button" disabled title="未连接 TaskStore">保存到服务 · 未连接</button></div></form></div></section><section class="section"><div class="section-head"><div><h2>待判断收件箱</h2><p class="hint">先查重复、证据与授权；真实来源不自动等于已接受。</p></div></div>${state.proposal?`<div class="panel warn"><h3>P-01 · ${escape(state.proposal.kind)} · ${escape(state.proposalStage)}</h3><div class="chips">${chip(state.proposal.origin,'work')}${chip('业务：未接受','review')}${chip('运行：未派发','sync')}</div><p><strong>观察：</strong>${escape(state.proposal.observation)}</p><p><strong>预期：</strong>${escape(state.proposal.expected)}</p><p><strong>判断者：</strong>${escape(state.proposal.judge)}；相似提议和原始证据仍需核对。</p><div class="action-row"><button class="inline-action" data-action="request-review">模拟送交判断</button><button class="inline-action" data-action="need-evidence">标记需有限补证</button><button class="inline-action" disabled title="需要权限、基线与独立判断；原型未连接服务">直接接受 · 不可用</button></div></div>`:'<div class="empty-state">尚无本页提议。上方可提交一条示例；真实 TaskStore 未连接。</div>'}<div class="panel soft"><h3>进入执行之前</h3><p>常规修复可由现有领域责任者在权限与预算内接受；新方向、争议或跨领域取舍需合适独立判断者比较价值、替代与消费者验收。归并重复项须保留新证据。</p></div></section>`}
    function renderRoles(){const choices=['改现有方法','同职责加容量','临时专项','新职责试行'];return `<div class="hero"><div class="hero-top"><div><div class="meta">分工管理讨论 · 示例</div><h2>接续核对由谁持续承担？</h2><p>先回看任务与交接历史，区分知识缺口、工具问题、容量和独立职责缺口。新聊天窗口本身不是新角色。</p></div><button class="primary" data-select="role">查看职责说明</button></div></div><section class="section"><div class="section-head"><div><h2>历史依据与反证</h2><p class="hint">以下是合成观察，不是负荷统计或试行结果。</p></div></div><div class="panel"><p>示例：TASK-104 的接续通知曾到达，却未能证明下游采用；DOC-021 r2 因此改变验收。也可能只是交接方法或来源入口不清，不足以直接证明需要新岗位。</p><div class="action-row"><button class="inline-action" data-select="task">查看任务依据</button><button class="inline-action" data-select="k_role">查看分工假设</button></div></div></section><section class="section"><div class="section-head"><div><h2>比较替代办法</h2><p class="hint">先选择一种有界方案，结果要靠实际接续检验。</p></div></div><div class="panel"><div class="topic-tabs" role="group" aria-label="分工替代方案">${choices.map(x=>`<button data-role-choice="${escape(x)}" class="${state.roleChoice===x?'active':''}" aria-pressed="${state.roleChoice===x}">${escape(x)}</button>`).join('')}</div><p><strong>当前选择：</strong>${escape(state.roleChoice)}。${state.roleChoice==='新职责试行'?'需证明持续独立判断缺口，并明确与旧职责的边界。':state.roleChoice==='同职责加容量'?'保留逻辑职责，只增加受控实例与交接约定。':state.roleChoice==='临时专项'?'一次性目标完成后结束，未完事项交回原职责。':'先修正输入、工具和接续步骤，观察是否仍有持续缺口。'}</p><div class="compare"><div><strong>试行与回看</strong>首项工作：按 DOC-021 r2 接续 TASK-104。首轮真实接续后核对等待、遗漏、返工、消费者效果与成本；当前未运行。</div><div><strong>退出与交接</strong>若收益不成立，停止试行触发，交接未完任务与知识；停止请求还要核对在途实例结果。</div></div><div class="action-row"><button class="inline-action" data-action="role-trial">模拟登记${escape(state.roleChoice)}提议</button><button class="inline-action" data-action="role-withdraw" ${state.roleTrial==='未开始'?'disabled title="尚无本页试行提议"':''}>模拟撤回并待交接</button></div><p>本页状态：${escape(state.roleTrial)}。没有真实职责调整、实例派发或收益结论。</p></div></section>`}
    function renderSchedules(){return `<section class="section"><div class="section-head"><div><h2>阶段回看 · SCH-04</h2><p class="hint">日程定义、触发实例、业务任务和运行各有状态。</p></div></div><div class="panel"><div class="chips">${chip(state.schedulePaused?'日程：已模拟暂停':'日程：启用示意',state.schedulePaused?'review':'good')}${chip('任务：未接受','review')}${chip('运行：未派发','sync')}</div><p>目标：检查阶段亲用证据和两类讨论是否有新取舍。计划：2026-10-21 09:00，Asia/Taipei（示例）。错过时汇总一次检查；重叠时合并并先对账。</p><div class="action-row"><button class="inline-action" data-action="schedule-pause">${state.schedulePaused?'模拟恢复后续触发':'模拟暂停后续触发'}</button><button class="inline-action" data-action="occurrence-check">模拟到期检查</button></div><p>暂停只影响未来触发，不自动取消已关联的任务或在途运行。</p></div></section><section class="section"><div class="section-head"><div><h2>到期实例 · OCC-04</h2><p class="hint">同一计划时点只应对应一个稳定实例。</p></div></div><div class="panel soft"><div class="chips">${chip(state.occurrence,'muted')}</div><p>${state.occurrence==='尚未到期'?'尚无触发；需要在到期时重新读取目标、权限、任务与知识修订。':'本页模拟已检查：仍需判断是否有有效工作；没有新证据时可记录“无需动作”，不制造空任务。'}</p><div class="action-row"><button class="inline-action" data-select="occurrence">查看实例说明</button><button class="inline-action" data-view="operations">查看结果未知的恢复</button></div></div></section>`}

    function renderEvaluations(){const [title,question]=evalCases[state.evalCase];return `<section class="section"><div class="section-head"><div><h2>评价问题与可比条件</h2><p class="hint">目前只有设计和有限合成反例；没有生产评价样本或总收益结论。</p></div></div><div class="panel"><p>先固定任务、材料包、权限、消费模型、时间切分、调用预算和评价 rubric，再比较直接读原材料、原生 Wiki、带治理约定的 Wiki。首轮失败必须保留，不能只看通过样本。</p><table class="simple-table"><thead><tr><th>条件</th><th>独立消费产物</th><th>真实用户效果</th><th>总成本</th></tr></thead><tbody><tr><td>原材料</td><td>未运行</td><td>未知</td><td>未记录</td></tr><tr><td>原生 Wiki</td><td>未运行</td><td>未知</td><td>未记录</td></tr><tr><td>治理 Wiki</td><td>未运行</td><td>未知</td><td>未记录</td></tr></tbody></table></div></section><section class="section"><div class="section-head"><div><h2>逐 case 查看</h2><p class="hint">来源忠实、纠正传播、独立消费、恢复与成本分别核对。</p></div></div><div class="topic-tabs" role="group" aria-label="评价场景">${evalCases.map(([name],i)=>`<button data-eval-case="${i}" class="${state.evalCase===i?'active':''}" aria-pressed="${state.evalCase===i}">${escape(name)}</button>`).join('')}</div><div class="panel soft"><h3>${escape(title)}</h3><p>${escape(question)}</p><div class="compare"><div><strong>应收集</strong>固定来源与修订、首轮输出、错误/遗漏、消费者产物、实际操作结果、人工介入与全部成本。</div><div><strong>当前缺项</strong>尚无独立消费者的真实产物，也无用户亲用、维护与恢复成本；结果保持“未知”。</div></div><div class="action-row"><button class="inline-action" data-view="knowledge">查看知识样页</button><button class="inline-action" data-select="eval">查看评价边界</button></div></div></section>`}

      const c=state.correction;
      if(action==='correction-decide'&&c?.stage==='candidate'){c.stage='accepted';c.acceptedFingerprint=c.fingerprint}
      if(action==='correction-reject'&&c?.stage==='candidate'){c.stage='rejected';c.closeReason='示例：依据不足，需补可核对原件。'}
      if(action==='correction-duplicate'&&c?.stage==='candidate'){c.stage='duplicate';c.closeReason='示例：与既有纠正重复，保留新增证据供原 Review 核对。'}
      if(action==='correction-no-change'&&c?.stage==='candidate'){c.stage='no_change';c.closeReason='示例：现有适用条件已覆盖该反例，记录判断后关闭。'}
      if(action==='correction-publish'&&c?.stage==='accepted'&&c.acceptedFingerprint===c.fingerprint){if((state.sourceUnavailable&&c.id==='wiki')||c.basisRevision!==knowledgeRevision(c.id)){toast('来源或候选基线须先复核，未发出发布请求。');return}c.stage='publish_pending'}
      if(action==='correction-unknown'&&c?.stage==='publish_pending')c.stage='unknown';
      if(action==='correction-return'&&c?.stage==='publish_pending')c.stage='published';
      if(action==='correction-reconcile'&&c?.stage==='unknown')c.stage='published';
      if(action==='correction-read'&&c?.stage==='published')c.stage='read';
      render();
      if(action==='correction-open')document.getElementById('correctionForm')?.scrollIntoView({behavior:'smooth',block:'center'});
    }
    document.addEventListener('click',e=>{
      const s=e.target.closest('[data-select]');if(s){select(s.dataset.select);return}
      const open=e.target.closest('[data-open-doc]');if(open){openDocument(open.dataset.openDoc);return}
      const docMode=e.target.closest('[data-doc-mode]');if(docMode){state.docMode=docMode.dataset.docMode;render();document.querySelector(`[data-doc-mode="${state.docMode}"]`)?.focus();return}
      const docRevision=e.target.closest('[data-doc-revision]');if(docRevision){state.docRevision=docRevision.dataset.docRevision;render();document.querySelector(`[data-doc-revision="${state.docRevision}"]`)?.focus();return}
      const docRow=e.target.closest('[data-doc-row]');if(docRow){openDocument(docRow.dataset.docRow);return}
      const t=e.target.closest('[data-topic]');if(t){state.topic=t.dataset.topic;state.search='';state.selected=Object.keys(knowledge).find(id=>state.topic==='全部专题'||knowledge[id].topic===state.topic);render();return}
      const choice=e.target.closest('[data-role-choice]');if(choice){state.roleChoice=choice.dataset.roleChoice;render();return}
      const evalChoice=e.target.closest('[data-eval-case]');if(evalChoice){state.evalCase=Number(evalChoice.dataset.evalCase);render();return}
      const v=e.target.closest('[data-view]');if(v){state.view=v.dataset.view;state.docReader=null;state.selected=({focus:'discussion',inbox:'proposal',tasks:'task',documents:'doc',knowledge:'wiki',cognition:'discussion',roles:'role',schedules:'schedule',operations:'run',evaluations:'eval'})[state.view];if(state.view==='knowledge'){state.topic='全部专题';state.search=''}render();$('sidebar').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'smooth'});return}
      const a=e.target.closest('[data-action]');if(a){act(a.dataset.action);return}
      if(e.target.id==='adoptButton'){state.adopted=true;render();toast('仅本页模拟采用 r2；未写入任何服务。');return}
      if(e.target.id==='resetButton'){Object.assign(state,{view:'focus',selected:'discussion',docReader:null,docMode:'rendered',docRevision:'r2',adopted:false,topic:'全部专题',search:'',proposal:null,proposalStage:'未提交',docCompare:false,formalOpen:false,formalStage:'draft',correction:null,correctionForm:false,sourceUnavailable:false,historyView:false,roleChoice:'改现有方法',roleTrial:'未开始',schedulePaused:false,occurrence:'尚未到期',evalCase:0});render();toast('演示状态已重置。');return}
      if(e.target.id==='menuButton'){const open=$('sidebar').classList.toggle('open');e.target.setAttribute('aria-expanded',String(open));return}
      if(e.target.id==='closeDetail')$('detail').classList.add('collapsed');
    });
    document.addEventListener('keydown',e=>{const row=e.target.closest?.('[data-doc-row]');if(row&&e.target===row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDocument(row.dataset.docRow)}});
    document.addEventListener('submit',e=>{
      if(!['proposalForm','knowledgeSearchForm','correctionForm'].includes(e.target.id))return;
      e.preventDefault();const form=new FormData(e.target);
      if(e.target.id==='proposalForm'){const observation=String(form.get('observation')||'').trim(),expected=String(form.get('expected')||'').trim();if(!observation||!expected)return;state.proposal={origin:String(form.get('origin')),kind:String(form.get('kind')),judge:String(form.get('judge')),observation,expected};state.proposalStage='待判断';state.selected='proposal';toast('仅本页登记提议；尚未接受或派发。')}
      if(e.target.id==='knowledgeSearchForm'){state.search=String(form.get('query')||'').trim();const match=Object.keys(knowledge).find(id=>(state.topic==='全部专题'||knowledge[id].topic===state.topic)&&[knowledge[id].id,knowledge[id].title,knowledge[id].summary,knowledge[id].type,knowledge[id].topic].join(' ').toLocaleLowerCase().includes(state.search.toLocaleLowerCase()));if(match)state.selected=match}
      if(e.target.id==='correctionForm'){const source=String(form.get('source')||'').trim(),textValue=String(form.get('text')||'').trim();if(!source||!textValue)return;const basisRevision=state.historyView&&state.selected==='wiki'?'v2':knowledgeRevision(state.selected);state.correction={id:state.selected,source,text:textValue,basisRevision,fingerprint:fingerprint(state.selected+'\n'+basisRevision+'\n'+source+'\n'+textValue),stage:'candidate'};state.correctionForm=false;toast('仅本页建立纠正候选；正文仍未修订。')}
      render();
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('sidebar').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false')}if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-select]')){e.preventDefault();select(e.target.dataset.select)}});
    render();
  })();
  </script>
</body>
</html>
