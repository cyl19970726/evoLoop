name: Application slice

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: evoloop
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: evoloop_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evoloop -d evoloop_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://evoloop:test-only-password@127.0.0.1:5432/evoloop_ci_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
